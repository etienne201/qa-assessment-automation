name: Playwright QA Tests + Allure Report

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

  # 3 runs per day (scheduled regression)
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC
    - cron: '0 8 * * *'   # 08:00 UTC
    - cron: '0 16 * * *'  # 16:00 UTC

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BASE_URL: ${{ vars.BASE_URL }}

# ──────────────────────────────────────────────
# 1. TEST JOB
# ──────────────────────────────────────────────
jobs:
  test:
    name: ${{ matrix.project }} tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          CI: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results


# ──────────────────────────────────────────────
# 2. ALLURE REPORT
# ──────────────────────────────────────────────
  allure-report:
    name: Generate & Publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    outputs:
      report_url: ${{ steps.url.outputs.report }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate report
        run: allure generate allure-results --clean -o allure-report

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      - name: Set report URL
        id: url
        run: echo "report=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT


# ──────────────────────
# 3. EMAIL NOTIFICATION 
# ──────────────────────
  notify:
    name: Send Email Report
    runs-on: ubuntu-latest
    needs: [test, allure-report]

    if: always() && (github.event_name == 'push' || github.event_name == 'schedule')

    steps:
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          to: ${{ secrets.EMAIL_USERNAME }}
          from: QA Automation Bot

          subject: "Playwright QA Report - ${{ github.event_name }} - ${{ github.repository }}"

          body: |
            Hello ${{ github.actor }},

            Test execution completed successfully.

            Trigger type: ${{ github.event_name }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            📊 Allure Report:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

            🚀 Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            QA Automation Bot
name: Playwright QA Tests + Allure Report

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  # Run 3 times per day
  schedule:
    - cron: '0 0 * * *'    # 00:00 UTC
    - cron: '0 8 * * *'    # 08:00 UTC
    - cron: '0 16 * * *'   # 16:00 UTC

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BASE_URL: https://qa-assessment.pages.dev/

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Run tests in parallel
  # ──────────────────────────────────────────────
  test:
    name: ${{ matrix.project }} tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - mobile-chrome

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          BASE_URL: ${{ env.BASE_URL }}
          CI: true

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### 🚀 Test Results for ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Browser | Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "| ✅ Passed | ${{ matrix.project }} | [View Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ Failed | ${{ matrix.project }} | [Check Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results
          retention-days: 14

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14

      - name: Upload JSON Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.project }}
          path: test-results
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 2: Generate Allure Report
  # ──────────────────────────────────────────────
  allure-report:
    name: Generate & Publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    outputs:
      report_url: ${{ steps.report-url.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline --save-dev

      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      - name: Generate Report URL
        id: report-url
        run: |
          echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────
  # Job 3: Send Email Notification
  # ──────────────────────────────────────────────
  notify:
    name: Send Email Report
    runs-on: ubuntu-latest
    needs:
      - test
      - allure-report
    if: always() && github.event_name == 'push'

    steps:
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: |
            Playwright QA Report - ${{ github.repository }}

          to: ${{ github.event.pusher.email }}

          from: QA Automation Bot

          body: |
            Hello ${{ github.actor }},

            Your Playwright test execution has completed.

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Allure Report:
            ${{ needs.allure-report.outputs.report_url }}

            GitHub Actions Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            QA Automation Bot
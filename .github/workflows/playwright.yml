name: Playwright QA Tests + Allure Report

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 0 * * *'    # 00:00 UTC
    - cron: '0 8 * * *'    # 08:00 UTC
    - cron: '0 16 * * *'   # 16:00 UTC

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BASE_URL: https://qa-assessment.pages.dev/

jobs:

# ─────────────────────────────
# 1. TEST JOB
# ─────────────────────────────
  test:
    name: ${{ matrix.project }} tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - mobile-chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npm test -- --project=${{ matrix.project }}
        env:
          BASE_URL: ${{ env.BASE_URL }}
          CI: true

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.project }}
          path: test-results


# ─────────────────────────────
# 2. ALLURE REPORT
# ─────────────────────────────
  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    outputs:
      report_url: ${{ steps.report.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Allure
        run: npm install -g allure-commandline

      - name: Generate report
        run: allure generate allure-results -o allure-report --clean

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      - name: Set report URL
        id: report
        run: |
          echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT

      - name: Generate Summary
        if: always()
        run: |
          echo "### Rapport de Test Playwright" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Élément | Lien / Détails |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Allure Report** | [Consulter le rapport HTML](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) |" >> $GITHUB_STEP_SUMMARY
          echo "| **GitHub Run** | [Voir les détails de l'exécution](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branche** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auteur** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Généré automatiquement par l'automatisation QA" >> $GITHUB_STEP_SUMMARY


# ─────────────────────────────
# 3. EMAIL NOTIFICATION
# ─────────────────────────────
  notify:
    name: Send Email Report
    runs-on: ubuntu-latest
    needs: allure-report
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule')

    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          from: QA Automation Bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}

          subject: "Playwright QA Report - ${{ github.event_name }}"

          body: |
            Hello,

            Test execution completed.

            Trigger: ${{ github.event_name }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Allure Report:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

            Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            QA Automation Bot
name: Playwright QA Tests + Allure Report

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  # 3 automatic executions per day
  schedule:
    - cron: '0 0 * * *'    # 00:00 UTC
    - cron: '0 8 * * *'    # 08:00 UTC
    - cron: '0 16 * * *'   # 16:00 UTC

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BASE_URL: https://qa-assessment.pages.dev/

jobs:

# ─────────────────────────────────────────────
# 1. PLAYWRIGHT TESTS
# ─────────────────────────────────────────────
  test:
    name: ${{ matrix.project }} tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - mobile-chrome

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          BASE_URL: ${{ env.BASE_URL }}
          CI: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results
          retention-days: 7

      - name: Generate GitHub Summary
        if: always()
        run: |
          echo "## Playwright Test Results - ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "Tests passed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | ${{ matrix.project }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY


# ─────────────────────────────────────────────
# 2. GENERATE & DEPLOY ALLURE REPORT
# ─────────────────────────────────────────────
  allure-report:
    name: Generate & Publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    outputs:
      report_url: ${{ steps.report-url.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      - name: Generate report URL
        id: report-url
        run: |
          echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT

      - name: Generate workflow summary
        if: always()
        run: |
          echo "## Allure HTML Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Link |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Allure Report | https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Run | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY


# ─────────────────────────────────────────────
# 3. EMAIL NOTIFICATION
# ─────────────────────────────────────────────
  notify:
    name: Send QA Email Report
    runs-on: ubuntu-latest
    needs:
      - test
      - allure-report

    if: always() && (github.event_name == 'push' || github.event_name == 'schedule')

    steps:
      - name: Send HTML email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: Playwright QA Report - ${{ github.event_name }}

          from: QA Automation Bot <${{ secrets.MAIL_USERNAME }}>

          to: ${{ secrets.MAIL_TO }}

          html_body: |
            <div style="font-family: Arial, sans-serif; padding: 20px;">

              <h2>🚀 Playwright QA Execution Report</h2>

              <p>
                Your automated Playwright execution has completed.
              </p>

              <table border="1" cellpadding="10" cellspacing="0" style="border-collapse: collapse;">
                <tr>
                  <td><strong>Repository</strong></td>
                  <td>${{ github.repository }}</td>
                </tr>

                <tr>
                  <td><strong>Branch</strong></td>
                  <td>${{ github.ref_name }}</td>
                </tr>

                <tr>
                  <td><strong>Triggered By</strong></td>
                  <td>${{ github.actor }}</td>
                </tr>

                <tr>
                  <td><strong>Trigger Type</strong></td>
                  <td>${{ github.event_name }}</td>
                </tr>

                <tr>
                  <td><strong>Commit</strong></td>
                  <td>${{ github.sha }}</td>
                </tr>
              </table>

              <br>

              <h3>📊 Reports</h3>

              <ul>
                <li>
                  <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/">
                    View Allure HTML Report
                  </a>
                </li>

                <li>
                  <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                    View GitHub Actions Run
                  </a>
                </li>
              </ul>

              <br>

              <p>
                Regards,<br>
                QA Automation Bot
              </p>

            </div>